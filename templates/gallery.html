{% extends "base.html" %}

{% block content %}
<section class="page-hero">
  <p class="eyebrow">Gallery</p>
  <h1>Tailoring, formalwear, bridal work, fabrics, and atelier details.</h1>
  <p>A visual look at tailoring, formalwear, bridal work, and clothier details.</p>
</section>

<section class="gallery-grid" aria-label="Gallery of tailoring images">
  {% for item in gallery %}
    <button class="gallery-item reveal" type="button" data-lightbox="{{ image_path(item.image) }}" data-alt="{{ item.alt }}">
      <img src="{{ image_path(item.image) }}" alt="{{ item.alt }}" loading="lazy">
    </button>
  {% endfor %}
</section>

<div class="lightbox" data-lightbox-modal hidden>
  <button class="lightbox__close" type="button" data-lightbox-close aria-label="Close image">Close</button>
  <img src="" alt="">
</div>
{% endblock %}
